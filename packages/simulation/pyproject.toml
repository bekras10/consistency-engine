[project]
name = "consistency-simulation"
version = "0.1.0"
description = "Deterministic synthetic prediction exchange and scenario generators."
requires-python = ">=3.12"
dependencies = ["consistency-core"]

[tool.uv.sources]
consistency-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/consistency_simulation"]
