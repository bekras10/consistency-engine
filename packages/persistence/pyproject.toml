[project]
name = "consistency-persistence"
version = "0.1.0"
description = "PostgreSQL schema and shared repository for Consistency Engine."
requires-python = ">=3.12"
dependencies = [
    "consistency-core",
    "consistency-pipeline",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
]

[tool.uv.sources]
consistency-core = { workspace = true }
consistency-pipeline = { workspace = true }

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/consistency_persistence"]
