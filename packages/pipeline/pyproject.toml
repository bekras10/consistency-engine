[project]
name = "consistency-pipeline"
version = "0.1.0"
description = "Real-time detection pipeline, lifecycle, pub/sub, journal and deterministic replay."
requires-python = ">=3.12"
dependencies = ["consistency-core", "consistency-connectors"]

[tool.uv.sources]
consistency-core = { workspace = true }
consistency-connectors = { workspace = true }

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/consistency_pipeline"]
