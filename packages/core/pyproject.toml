[project]
name = "consistency-core"
version = "0.1.0"
description = "Financial mathematics and shared domain models for Consistency Engine."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7,<3", "PyYAML>=6.0"]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/consistency_core"]
