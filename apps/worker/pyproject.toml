[project]
name = "consistency-worker"
version = "0.1.0"
description = "Ingestion / detection / replay worker for Consistency Engine."
requires-python = ">=3.12"
dependencies = [
    "consistency-core",
    "consistency-connectors",
    "consistency-simulation",
    "consistency-pipeline",
]

[tool.uv.sources]
consistency-core = { workspace = true }
consistency-connectors = { workspace = true }
consistency-simulation = { workspace = true }
consistency-pipeline = { workspace = true }

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/consistency_worker"]
