[project]
name = "consistency-api"
version = "0.1.0"
description = "FastAPI service for Consistency Engine."
requires-python = ">=3.12"
dependencies = [
    "consistency-core",
    "consistency-connectors",
    "consistency-persistence",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]

[tool.uv.sources]
consistency-core = { workspace = true }
consistency-connectors = { workspace = true }
consistency-persistence = { workspace = true }

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/consistency_api"]
