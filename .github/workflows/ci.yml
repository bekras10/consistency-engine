name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATA_SOURCE: synthetic
      ENABLE_KALSHI_API: "false"
      KALSHI_AUTHORIZATION_CONFIRMED: "false"
      ENABLE_LIVE_TRADING: "false"
    services:
      postgres:
        # Public ECR mirror of library/postgres. GitHub-hosted runners hit
        # Docker Hub's unauthenticated pull limit on postgres:16.
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: consistency
          POSTGRES_PASSWORD: consistency
          POSTGRES_DB: consistency
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U consistency -d consistency"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run --frozen ruff check .
      - name: Ruff format
        run: uv run --frozen ruff format --check .
      - name: Mypy (strict)
        run: uv run --frozen mypy
      - name: Unit + golden tests
        run: uv run --frozen pytest tests/unit tests/golden tests/replay
      - name: Property tests
        run: uv run --frozen pytest tests/property
      - name: Bundled fixtures are reproducible
        run: uv run --frozen python scripts/generate_datasets.py --bundled --check
      - name: Migrations up, down, up
        env:
          DATABASE_URL: postgresql+asyncpg://consistency:consistency@127.0.0.1:5432/consistency
        run: |
          uv run --frozen alembic upgrade head
          uv run --frozen alembic downgrade base
          uv run --frozen alembic upgrade head
      - name: Integration tests
        env:
          DATABASE_URL: postgresql+asyncpg://consistency:consistency@127.0.0.1:5432/consistency
        run: uv run --frozen pytest tests/integration
      - name: Benchmark smoke
        env:
          DATABASE_URL: postgresql+asyncpg://consistency:consistency@127.0.0.1:5432/consistency
          BENCHMARK_ALLOW_PORT_5432: "1"
          PYTHONPATH: packages/core/src:packages/simulation/src:packages/connectors/src:packages/pipeline/src:packages/persistence/src:apps/api/src:apps/worker/src
        run: |
          uv run --frozen python scripts/benchmark.py --smoke --output "$RUNNER_TEMP/bench-smoke.json"
          uv run --frozen python scripts/check_benchmark_smoke.py "$RUNNER_TEMP/bench-smoke.json"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: consistency
          POSTGRES_PASSWORD: consistency
          POSTGRES_DB: consistency
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U consistency -d consistency"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      E2E_SKIP_COMPOSE: "1"
      POSTGRES_PORT: "5432"
      DATABASE_URL: postgresql+asyncpg://consistency:consistency@127.0.0.1:5432/consistency
      REPLAY_API_TOKEN: ci-replay-token
      REPLAY_MUTATIONS_PUBLIC: "false"
      DASHBOARD_GATEWAY_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install Python
        run: uv sync --frozen
      - name: Install frontend
        working-directory: apps/web
        run: npm ci
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Playwright
        run: bash scripts/e2e.sh
